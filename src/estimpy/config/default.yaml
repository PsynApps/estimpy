---
estimpy-version: 2.0.0
additional-config-profiles: ~
analysis:
  oscilloscope:
    # Display window duration for tonal content (milliseconds)
    window-length: 10
    # Pulse detection configuration
    pulse-detection:
      # Enable automatic pulse detection to switch oscilloscope window length
      enabled: True
      # Minimum number of pulses that must be detected within the lookahead window
      # to activate pulse mode. Higher values reduce false positives from isolated transients.
      count-threshold: 5
      # Minimum coefficient of variation (std/mean) of 2ms sub-window RMS values required
      # to confirm pulsed content. Pulses produce high CV (energy alternates between on/off
      # states) while tonal content with smooth amplitude modulation has low CV.
      cv-threshold: 1.5
      # Display window duration for pulsed content (milliseconds)
      window-length: 500
    # Minimum RMS energy threshold (fraction of full scale) below which flat line is shown
    silence-threshold: 0.01
    # Hysteresis threshold for trigger detection (fraction of peak amplitude)
    trigger-hysteresis: 0.05
  spectrogram:
    # The minimum frequency to show on the spectrogram
    frequency-min: 0
    # The maximum frequency to show on the spectrogram. If None, will autoscale using the method from frequency-max-method.
    frequency-max: ~
    # The method to use to determine the maximum frequency when frequency-max is not set
    frequency-max-method: spectral_edge
    # The factor by which to multiply the autoscaled frequency max value (for visual padding)
    frequency-max-padding-factor: 1.1
    # Length of the FFT. If None, automatically sized based on the output resolution
    # and estimated frequency content so that there is approximately one frequency
    # bin per pixel in the spectrogram panel. Set an explicit value to override.
    nfft: ~
    # Use reassigned spectrogram for sharper time-frequency localization
    reassign: True
    # Smoothing intensity for the reassigned spectrogram (0 = no smoothing, 1.0 = smooth to ~1 true frequency resolution bin)
    reassign-smoothing: 1.0
    # Window function to use when generating spectrogram. See scipy.signal.get_window documentation for available options.
    window-function: hann
  # Window size to use when processing audio data (in number of samples)
  window-size: 2048
  # Window overlap to use when processing audio data (in number of samples). Must be less than analysis.window-size. Defaults to 3 * analysis.window-size // 4
  window-overlap: ~
audio:
  # Configuration for audio export
  export:
    # Audio codec (passed to ffmpeg). If not set (~), automatically determined:
    # for save-audio, matches the output file extension or the input file's codec;
    # for video export, uses a container-compatible codec (AAC for MP4/MOV).
    codec: ~
    # FFmpeg extra arguments (keys are argument name, values are argument values).
    # When codec is auto (~), sensible quality defaults are applied per codec.
    # Explicit args here override the auto defaults.
    ffmpeg-extra-args: {}
    # Output file format / container. If not set (~), inferred from the output file
    # extension or the input file's format.
    format: ~
    # Output sample rate in Hz. If not set (~), preserves the source sample rate.
    sample-rate: ~
  # Frequency transform — shift and/or scale the frequency content of the audio
  frequency:
    # Multiplicative frequency scaling factor. All frequency components are multiplied
    # by this value. A value of 2 doubles all frequencies; 0.5 halves them. 1 = no change.
    # Harmonic relationships are preserved. Content pushed above Nyquist (half the sample
    # rate) is discarded; similarly, the stereo stim bandpass filter downstream will
    # remove content outside its passband.
    scale: 1
    # Additive frequency shift in Hz. All frequency components are shifted by this amount.
    # A value of 250 shifts everything up by 250 Hz; -100 shifts down by 100 Hz. 0 = no change.
    # Unlike scaling, shifting does NOT preserve harmonic relationships (ratios change).
    # Content shifted below 0 Hz is discarded.
    shift: 0
  ramp:
    # Amplitude ramp level as a percentage (0-100). Determines how much the amplitude is reduced
    # at the start of the ramp, increasing smoothly to 100% by the end of the file. A value of 0
    # disables the ramp. A value of 20 starts playback at 80% amplitude, 100 starts from silence.
    level: 0
    # Exponential easing parameter controlling the ramp curve shape. A value of 0 produces a linear
    # ramp. Negative values (-10 to 0) create a faster initial rise that slows toward the end.
    # Positive values (0 to 10) create a slower initial rise that accelerates toward the end.
    # The curve follows (e^(kt)-1)/(e^k-1) where k is this value and t is normalized time (0 to 1).
    shape: 0
  stereo-stim:
    # Enable stereo stim mode. Applies a safety filter chain (bandpass) to the audio
    # data before visualization and export, removing DC offset, subsonic content, and high-frequency
    # content that could be harmful with direct-output stereostim devices.
    enabled: False
    # High-pass cutoff frequency in Hz. Removes DC offset and subsonic content that wastes energy
    # as heat without producing sensation. Also prevents electrochemical damage from DC.
    high-pass: 20
    # Low-pass cutoff frequency in Hz. Reduces current delivery through the low-impedance
    # high-frequency skin path.
    low-pass: 12000
files:
  input:
    # Search input file patterns recursively
    recursive: False
  output:
    # Path in which to save exported files
    path: ./
    # Overwrite existing files by default
    overwrite-default: False
    # Prompt to overwrite existing files. Not relevant if overwrite-default is set to True.
    overwrite-prompt: True
metadata:
  default-genre: Estim
  # Pattern to extract metadata from file name
  file-path-pattern: (?P<artist>[^\\\/]*?) - (?P<title>.*)
player:
  # Start playback immediately
  autoplay: False
  # Use reassigned spectrogram in the player. Disabling falls back to the standard
  # spectrogram which is significantly faster to compute.
  spectrogram-reassign: False
  # Repeat mode: none (play through playlist and stop), one (loop current file), all (loop playlist)
  repeat: none
  # Amount of time to skip (in seconds)
  skip-length: 60
  # The amount of latency that is required to render the video (in seconds)
  video-render-latency: 0.5
  # The volume at which to start playback (0 to 100)
  volume-start: 50
  # The amount to change the volume when up or down arrow are pressed (0 to 100)
  volume-step: 1
  # Minimum amount of time to smoothly transition to a new volume (i.e. with a volume change of 1)
  volume-ramp-min-length: 1
  # Maximum amount of time to smoothly transition to a new volume (i.e. with a volume change of 100)
  volume-ramp-max-length: 5
# Configuration for video export encoding
video:
  export:
    # Codec to encode the video (passed to ffmpeg)
    codec: libx265
    # FFmpeg extra arguments (keys are argument name, values are argument values, empty string value will just include the argument name)
    ffmpeg-extra-args:
      '-hide_banner': ''
      '-loglevel': 'error'
      '-y': ''
      '-pix_fmt': 'yuv420p10le'
      '-colorspace': 'bt709'
      '-crf': 22
      '-preset': medium
      '-movflags': '+faststart'
      '-tune': animation
    # Container format of the video
    format: mp4
    # Frames per second of the video
    fps: 30
    # Maximum number of seconds between keyframes (longer intervals will produce smaller files but can cause motion artifacts)
    keyframe-interval: ~
    # Show a preview image of the entire video at the beginning of the video
    preview:
      # Enable the preview image
      enabled: True
      # Number of seconds to show the preview image (including fade)
      length: 2
      # Number of seconds to fade from the preview image into the video
      fade-length: 1
    # Re-encode final video when concatenating segments. Takes more time but will result in a smaller file. May also improve compatibility or performance with players.
    reencode-segments: False
    # Number of seconds to encode before writing a temporary video file and restarting a new ffmpeg process (decrease this if out of memory errors occur). Smaller values will result in larger video files. Must be an integer to ensure seamless concatenation.
    segment-length: 3600
    # Maximum length of video to encode
    video-length-max: ~
visualization:
  # Configuration for image visualizations
  image:
    # Configuration for displaying image interactively
    display:
      # Size of image (in pixels)
      size: 1080x1080
      # Configuration for the time display
      time:
        enabled: True
        position: bottom
      # Configuration for the title panel
      title:
        enabled: False
      # Visualize stereo audio as 3 channels: A, B, and the triphase signal -(A+B) at the common electrode
      triphase: False
    # Configuration for exporting image
    export:
      # File format of image
      format: png
      # Size of image (in pixels)
      size: 1080x1080
      # Configuration for the time display
      time:
        enabled: True
        position: bottom
      # Configuration for the title panel
      title:
        enabled: True
      # Visualize stereo audio as 3 channels: A, B, and the triphase signal -(A+B) at the common electrode
      triphase: False
  style:
    # Configuration for the amplitude panels
    amplitude:
      # Per-channel amplitude color overrides. All default to ~ (inherit from channel color).
      channels:
        ch0:
          # The color to use for the background of the amplitude panel. If not defined, derived from channel color.
          background-color: ~
          # The color to use for the peak amplitude envelope. If not defined, inherits channel color.
          peak-color: ~
          # The color to use for the RMS amplitude envelope. If not defined, derived from channel color.
          rms-color: ~
        ch1:
          background-color: ~
          peak-color: ~
          rms-color: ~
        ch2:
          background-color: ~
          peak-color: ~
          rms-color: ~
      # Configuration for the axes of the amplitude panel
      axes:
        # Show the amplitude axis ticks and scale text
        enabled: True
      # The alpha level for the background of the amplitude envelopes.
      # Based on the channel color. Applies to all channels.
      # Not used if background colors are explicitly defined in amplitude channel config.
      background-alpha: 0.15
      # The amount of visual padding to add above and below the amplitude envelopes (0.2 = 20%)
      padding: 0.1
      # The alpha level for the RMS amplitude envelope.
      # Based on the channel color. Applies to all channels.
      # Not used if RMS colors are explicitly defined in amplitude channel config.
      rms-alpha: 0.5
      # Show the RMS amplitude envelope superimposed on the peak amplitude envelope
      show-rms: True
    # Configuration for axes
    axes:
      # Color of the axis ticks and scale text
      color: '#ffffff'
      # Font size of the scale text
      font-size: 16
      # Padding to add to text between edge of panel
      text-padding: 1
      # Length of axis ticks
      tick-length: 5
      # Width of axis ticks
      tick-width: 1
    # Font configuration
    font:
      # Configuration for symbol fonts
      symbols:
        # The font family name to use for symbols. Accepts multiple comma-delimited names and will use the first font found.
        family: Segoe UI Symbol, DejaVu Sans
      # Configuration for text fonts
      text:
        # Color of the text border
        border-color: '#000000'
        # Width of the text border
        border-width: 1
        # The font family name to use for text. Accepts multiple comma-delimited names and will use the first font found.
        family: Helvetica Neue, Helvetica, Arial, sans-serif
        # The font weight to use for text
        weight: bold
    # Per-channel identity configuration (color and label)
    channels:
      ch0:
        # The base color for this channel, used for amplitude, spectrogram color matching, and labels
        color: '#4799e8'
        # Whether to vertically invert the amplitude and spectrogram panels for this channel
        inverted: False
        # Label text displayed on the spectrogram panel
        label: A
      ch1:
        color: '#b775ff'
        inverted: False
        label: B
      ch2:
        color: '#e06cb7'
        inverted: False
        label: T
      # Configuration for channel labels displayed on spectrogram panels
      labels:
        # Show channel labels on spectrogram panels
        enabled: True
        # Font size of channel labels
        font-size: 64
    # Configuration for the oscilloscope waveform overlay
    oscilloscope:
      # Border width in pixels
      border-width: 10
      # Font size for the duration label
      font-size: 12
      # Height of box as fraction of combined amplitude+spectrogram panel height
      height-ratio: 0.5
      # Line width for the waveform in pixels
      line-width: 15
      # Background opacity (0.0 = fully transparent, 1.0 = fully opaque)
      opacity: 0.95
      # Width of box as fraction of panel width
      width-ratio: 0.25
    # Configuration for the spectrogram panels
    spectrogram:
      # Base colormap from which per-channel spectrograms are derived.
      # See matplotlib colormap documentation for a list of available options.
      color-map: jet
      # When True, the low-energy base region of the colormap is recolored to match
      # each channel's color. When False, uses the base colormap directly for all channels.
      match-channel-color: True
      # Controls how much of the colormap's base region is recolored to the channel's
      # color hue when match-channel-color is True. Specified in degrees of hue
      # distance (0-180) from the colormap's starting hue. Only affects the darkest,
      # low-energy portion of the colormap. Recolored samples are perceptually brightness-
      # matched and darkened toward the amplitude panel background. Small values (3-8)
      # produce a subtle tint; larger values extend recoloring into brighter regions.
      match-channel-color-radius: 5
      # Per-channel colormap overrides. When set, overrides the base colormap and
      # color matching for that channel. When not set (~), the channel uses the
      # base colormap with automatic color matching (if enabled).
      channels:
        ch0:
          color-map: ~
        ch1:
          color-map: ~
        ch2:
          color-map: ~
      # Configuration for the axes of the spectrogram
      axes:
        # Show the frequency axis ticks and scale text
        enabled: True
      # The dynamic range to use when rendering spectrograms (in decibels)
      dynamic-range: 90
    # Height ratios of panels
    subplot-height-ratios:
      title: 1
      amplitude:
        mono: 3
        stereo: 1.25
        triphase: 1.25
      spectrogram:
        mono: 6
        stereo: 3.25
        triphase: 3.25
    # Configuration for the title panel
    title:
      # Background color of the title text panel
      background-color: '#000000'
      # Color of the title text
      color: '#ffffff'
      # Font size of the title text
      font-size: 24
      # Maximum width factor of the title text
      width-factor-max: 0.9
    # Configuration for the time label
    time:
      # Font size for the time label
      font-size: 24
    video:
      # Time position line color
      position-line-color: '#ffffff'
  # Configuration for video visualizations
  video:
    # Configuration for displaying video interactively
    display:
      # Size of video (in pixels)
      size: 1920x1080
      # Configuration for the time display
      time:
        enabled: False
        position: top
      # Configuration for the title panel
      title:
        enabled: False
      # Visualize stereo audio as 3 channels: A, B, and the triphase signal -(A+B) at the common electrode
      triphase: True
      # Configuration for the oscilloscope waveform overlay
      oscilloscope:
        enabled: True
      # Number of seconds of data to show in sliding panels of video (half of this value shown before and after the current time)
      window-length: 20
    # Configuration for exported video visualization appearance
    export:
      # Size of video (in pixels)
      size: 1920x1080
      # Configuration for the time display
      time:
        enabled: True
        position: top
      # Configuration for the title panel for videos
      title:
        enabled: False
      # Configuration for the oscilloscope waveform overlay
      oscilloscope:
        enabled: True
      # Visualize stereo audio as 3 channels: A, B, and the triphase signal -(A+B) at the common electrode
      triphase: True
      # Number of seconds of data to show in sliding panels of video (half of this value shown before and after the current time)
      window-length: 20