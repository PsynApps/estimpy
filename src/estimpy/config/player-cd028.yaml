---
estimpy-version: 2.0.0
video:
  export:
    codec: libx264
    ffmpeg-extra-args:
      '-pix_fmt': 'yuv420p'
      '-crf': 36
      '-maxrate': '500k'
      '-profile:v': 'baseline'
      '-level': 1.3
    preview:
      enabled: False
visualization:
  image:
    export:
      size: 320x240
  style:
    axes:
      font-size: 32
    time:
      font-size: 48
  video:
    display:
      window-length: 6
    export:
      size: 320x240
      window-length: 6