---
visualization:
  image:
    export:
      size: 320x240
  style:
    axes:
      font-size: 32
    time:
      font-size: 48
  video:
    export:
      codec: libx264
      ffmpeg-extra-args:
        '-pix_fmt': 'yuv420p'
        '-crf': 32
        '-maxrate': '500k'
        '-profile:v': 'baseline'
        '-level': 1.3
      preview:
        enabled: False
      size: 320x240
    window-length: 6