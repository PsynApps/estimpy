---
visualization:
  image:
    export:
      size: 320x240
  style:
    axes:
      font-size: 32
    time:
      font-size: 48
  video:
    export:
      codec: libx264
      fmpeg-extra-args:
        '-pix_fmt': 'yuv420p'
        '-crf': 30
        '-movflags': ''
        '+faststart': ''
      preview:
        enabled: False
      size: 320x240
    window-length: 6