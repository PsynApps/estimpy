---
visualization:
  image:
    export:
      size: 1136x640
  style:
    axes:
      font-size: 32
    time:
      font-size: 48
  video:
    export:
      codec: libx264
      fmpeg-extra-args:
        '-pix_fmt': 'yuv420p'
        '-crf': 28
        '-profile:v': 'high'
        '-level': 3.1
        '-movflags': ''
        '+faststart': ''
      preview:
        enabled: False
      size: 1136x640
    window-length: 10
